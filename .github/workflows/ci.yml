name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run Ruff Format Check
        run: uv run ruff format Minify tests --check

      - name: Run Prettier Check
        run: npx --yes prettier@3 --check "Minify/**/*.{js,css,json}"

      - name: Run Ruff Check
        run: uv run ruff check Minify tests

      - name: Run Pytest
        run: uv run pytest

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run desktop tests
        run: dotnet test desktop/Minify.Desktop.slnx
