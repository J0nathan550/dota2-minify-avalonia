name: Release

# Every push to main that passes the tests becomes a release: the version is the next one after the latest
# v* tag (1.0.0.9 -> 1.0.1.0, see scripts/release_version.py) and the notes list the commits since then.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so versions are handed out in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Last commit of the upstream project; the first release lists the commits after it.
  FIRST_RELEASE_BASE: 13366a7

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and release notes
        id: next
        run: |
          version=$(python3 scripts/release_version.py next)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/release_version.py notes --base "$FIRST_RELEASE_BASE" > release-notes.md
          echo "Releasing $version"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner, so the AppImage runs on older glibc versions too.
          - os: ubuntu-22.04
            runtime: linux-x64
            suffix: linux-x86_64.AppImage
          - os: windows-latest
            runtime: win-x64
            suffix: win-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        run: uv run python scripts/package.py --version ${{ env.VERSION }} --runtime ${{ matrix.runtime }}

      # An older build that has to update itself to the package above.
      - name: Build baseline package for the update test
        run: uv run python scripts/package.py --version 1.0.0.0 --runtime ${{ matrix.runtime }} --skip-backend

      - name: End-to-end self-update test
        run: >
          uv run python scripts/e2e_update.py
          --old dist/Minify-1.0.0.0-${{ matrix.suffix }} --old-version 1.0.0.0
          --new dist/Minify-${{ env.VERSION }}-${{ matrix.suffix }} --new-version ${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runtime }}
          path: dist/Minify-${{ env.VERSION }}-${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        run: |
          gh release create "v$VERSION" \
            --title "Minify $VERSION" \
            --notes-file artifacts/release-notes/release-notes.md \
            --target "$GITHUB_SHA" \
            artifacts/package-*/*
